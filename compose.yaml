services:
  database:
    image: postgres:18
    environment:
      POSTGRES_USER: mapprentice
      POSTGRES_PASSWORD: local-development-password
      POSTGRES_DB: mapprentice
    ports:
      - "5432:5432"
    volumes:
      - mapprentice-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapprentice -d mapprentice"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mapprentice-data: